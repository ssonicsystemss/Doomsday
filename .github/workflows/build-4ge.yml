name: Build 4GE VST3

on:
  push:
    paths:
      - 'FourGE/**'
      - '!FourGE/Tools/UpdaterApp/**'
      - 'Shared/**'
      - '.github/workflows/build-4ge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: FourGE
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target FourGE_VST3 --parallel
      - name: Remove build leftovers (.lib / .exp), keep the symbols (.pdb) aside
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force build/symbols | Out-Null
          Get-ChildItem build/FourGE_artefacts -Recurse -Filter *.pdb -ErrorAction SilentlyContinue | Copy-Item -Destination build/symbols -Force -ErrorAction SilentlyContinue
          Get-ChildItem build/FourGE_artefacts/Release/VST3 -Recurse -Include *.lib,*.exp,*.pdb -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          exit 0
      - name: Upload VST3
        uses: actions/upload-artifact@v5
        with:
          name: 4GE-VST3-Windows
          path: FourGE/build/FourGE_artefacts/Release/VST3/
      - name: Upload symbols (for crash logs)
        uses: actions/upload-artifact@v5
        with:
          name: 4GE-symbols
          path: FourGE/build/symbols/
          if-no-files-found: warn
      - name: Publish to Releases (a plain download button)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          Compress-Archive -Path build/FourGE_artefacts/Release/VST3/* -DestinationPath 4GE-VST3-Windows.zip -Force
          gh release view 4ge-latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create 4ge-latest --title "4GE (latest test build)" --notes "Latest Windows VST3 test build." --prerelease --target ${{ github.sha }} }
          gh release upload 4ge-latest 4GE-VST3-Windows.zip --clobber
          gh release edit 4ge-latest --notes "Latest Windows VST3 test build: $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC, commit ${{ github.sha }}. Unzip, copy the .vst3 folder to C:\Program Files\Common Files\VST3."
