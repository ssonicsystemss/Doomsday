name: Build 4TUNE VST3

on:
  push:
    paths:
      - 'FourTune/**'
      - 'Shared/**'
      - '.github/workflows/build-4tune.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: FourTune
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target FourTune_VST3 --parallel
      - name: Remove build leftovers (.lib / .exp)
        shell: pwsh
        run: Get-ChildItem build/FourTune_artefacts/Release/VST3 -Recurse -Include *.lib,*.exp | Remove-Item
      - name: Upload VST3
        uses: actions/upload-artifact@v5
        with:
          name: 4TUNE-VST3-Windows
          path: FourTune/build/FourTune_artefacts/Release/VST3/
      - name: Publish to Releases (a plain download button)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          Compress-Archive -Path build/FourTune_artefacts/Release/VST3/* -DestinationPath 4TUNE-VST3-Windows.zip -Force
          gh release view 4tune-latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create 4tune-latest --title "4TUNE (latest test build)" --notes "Latest Windows VST3 test build." --prerelease --target ${{ github.sha }} }
          gh release upload 4tune-latest 4TUNE-VST3-Windows.zip --clobber
          gh release edit 4tune-latest --notes "Latest Windows VST3 test build: $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC, commit ${{ github.sha }}. Unzip, copy the .vst3 folder to C:\Program Files\Common Files\VST3."
