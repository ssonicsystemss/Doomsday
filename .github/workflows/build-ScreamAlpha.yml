name: Build 5CR34M 4LPH4 VST3

on:
  push:
    paths:
      - 'ScreamAlpha/**'
      - 'Shared/**'
      - '.github/workflows/build-ScreamAlpha.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ScreamAlpha
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target ScreamAlpha_VST3 --parallel
      - name: Remove build leftovers (.lib / .exp)
        shell: pwsh
        run: Get-ChildItem build/ScreamAlpha_artefacts/Release/VST3 -Recurse -Include *.lib,*.exp | Remove-Item
      - name: Upload VST3
        uses: actions/upload-artifact@v5
        with:
          name: 5CR34M-4LPH4-VST3-Windows
          path: ScreamAlpha/build/ScreamAlpha_artefacts/Release/VST3/
