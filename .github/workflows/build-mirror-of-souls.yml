name: Build Mirror of Souls VST3

on:
  push:
    paths:
      - 'MirrorOfSouls/**'
      - 'Shared/**'
      - '.github/workflows/build-mirror-of-souls.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: MirrorOfSouls
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target MirrorOfSouls_VST3 --parallel
      - name: Remove build leftovers (.lib / .exp)
        shell: pwsh
        run: Get-ChildItem build/MirrorOfSouls_artefacts/Release/VST3 -Recurse -Include *.lib,*.exp | Remove-Item
      - name: Upload VST3
        uses: actions/upload-artifact@v5
        with:
          name: Mirror-of-Souls-VST3-Windows
          path: MirrorOfSouls/build/MirrorOfSouls_artefacts/Release/VST3/
